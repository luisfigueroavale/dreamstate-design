name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: python3 -m py_compile 3d/lib/ds3d.py 3d/scenes/*/build.py
      - run: for f in 3d/scripts/*.sh scripts/*.sh; do sh -n "$f"; done
